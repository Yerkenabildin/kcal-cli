name: publish

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Use an OIDC-compatible npm CLI
        run: npm install --global npm@11.21.1

      - name: Verify release tag matches package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          PACKAGE_VERSION="$(node --print "require('./package.json').version")"
          test "$RELEASE_TAG" = "v$PACKAGE_VERSION" || {
            echo "Release tag $RELEASE_TAG does not match package version $PACKAGE_VERSION" >&2
            exit 1
          }

      - run: npm ci
      - run: npm test
      - run: node --check bin/kcal.mjs
      - run: node --check bin/yazio.mjs
      - run: npm pack --dry-run
      - run: npm publish --access public
